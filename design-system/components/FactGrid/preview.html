<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FactGrid preview</title>
<style>
  body { padding: var(--space-5); }
  .pv-stack { display: grid; gap: var(--space-5); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .pv-dark { background: var(--surface-dark); padding: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(S.FactGrid, { items: [
      { icon: 'users', label: 'Guests', value: '300', note: 'Seated. Up to 500 standing.' },
      { icon: 'clock', label: 'Hours', value: '9 to 8', note: 'Daily, in morning, afternoon and evening blocks.' },
      { icon: 'calendar', label: 'Rate', value: '$300', note: 'Per hour, with a two-hour minimum.' },
      { icon: 'sunset', label: 'Setting', value: 'One acre', note: 'On the hill above the Mission, facing the islands.' }
    ] }));
</script>
</body>
</html>
