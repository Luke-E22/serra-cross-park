<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steps preview</title>
<style>
  body { padding: 0; }
  .pv-dark { background: var(--surface-dark); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-dark', style: { padding: 'var(--space-7) var(--space-6)' } },
      h(S.SectionHeading, { eyebrow: 'Booking', title: 'How booking works', size: 'md', onDark: true }),
      h('div', { style: { height: 'var(--space-6)' } }),
      h(S.Steps, { tone: 'dark', steps: [
        { title: 'Send an inquiry', text: 'Tell us your date, time block and guest count.' },
        { title: 'We confirm the date', text: 'The park office checks the calendar and gets back to you.' },
        { title: 'Pay the site fee', text: 'We hold your date for up to 14 days while the fee arrives.' },
        { title: 'Get your letter', text: 'A confirmation letter makes it official.' }
      ] })));
</script>
</body>
</html>
