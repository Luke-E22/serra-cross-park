<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark preview</title>
<style>
  body { padding: var(--space-5); }
  .pv-stack { display: grid; gap: var(--space-5); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .pv-dark { background: var(--surface-dark); padding: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-stack' },
      h('div', { className: 'pv-row', style: { gap: 'var(--space-7)', alignItems: 'flex-end' } },
        h(S.Wordmark, { size: 'lg', nonprofit: true }),
        h(S.Wordmark, { size: 'md' }),
        h(S.Wordmark, { size: 'sm' })),
      h('div', { className: 'pv-dark pv-row', style: { gap: 'var(--space-7)', alignItems: 'flex-end' } },
        h(S.Wordmark, { size: 'lg', tone: 'paper', nonprofit: true }),
        h(S.Wordmark, { size: 'md', tone: 'paper' }))));
</script>
</body>
</html>
