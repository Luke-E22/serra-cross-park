<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GivingForm preview</title>
<style>
  body { padding: var(--space-5); }
  .pv-stack { display: grid; gap: var(--space-5); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .pv-dark { background: var(--surface-dark); padding: var(--space-5); }
  .pv-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); align-items: start; }
  @media (max-width: 720px) { .pv-two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-two' },
      h(S.GivingForm, { defaultTab: 'gift' }),
      h(S.GivingForm, { defaultTab: 'fee' })));
</script>
</body>
</html>
