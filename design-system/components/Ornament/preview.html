<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ornament preview</title>
<style>
  body { padding: var(--space-5); }
  .pv-stack { display: grid; gap: var(--space-5); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .pv-dark { background: var(--surface-dark); padding: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-stack' },
      h('div', { className: 'pv-row', style: { gap: 'var(--space-6)' } },
        h(S.Ornament, { size: 56 }), h(S.Ornament, { size: 56, tone: 'ink' }), h(S.Ornament, { size: 28 }), h(S.Ornament, { size: 20, tone: 'ink' })),
      h('div', { style: { maxWidth: '480px' } }, h(S.Ornament, { variant: 'rule', size: 28 })),
      h('div', { className: 'pv-dark' }, h('div', { style: { maxWidth: '480px' } }, h(S.Ornament, { variant: 'rule', tone: 'paper', size: 28 })))));
</script>
</body>
</html>
