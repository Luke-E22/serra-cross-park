<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice preview</title>
<style>
  body { padding: var(--space-5); }
  .pv-stack { display: grid; gap: var(--space-5); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .pv-dark { background: var(--surface-dark); padding: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SerraCross, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-stack', style: { maxWidth: '720px', gap: 'var(--space-4)' } },
      h(S.Notice, { title: 'No restrooms or water on site', icon: 'droplet' }, h('p', null, 'Rent portable restrooms and bring water for guests and vendors.')),
      h(S.Notice, { tone: 'caution', title: 'Gates lock at 8 PM', icon: 'clock' }, h('p', null, 'Guests and equipment must be off the hill by eight. Weekend events end by 7:30.'))));
</script>
</body>
</html>
