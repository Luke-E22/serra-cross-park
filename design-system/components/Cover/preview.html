<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serra Cross Park</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); overflow: hidden; }
  .cover { position: relative; height: 300px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 300px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 300px; }
  .green { fill: var(--green); }
  .brick { fill: var(--brick); }
  .ochre { fill: var(--ochre); }
  .navy { fill: var(--navy); }
  .sand { fill: var(--sandstone); }
  .cut { fill: var(--surface); }
  .blk { rx: var(--radius-none); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 80px; line-height: 0.92; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 2px; font-family: var(--font-serif); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">

  scales      sides in space-2 (8px) multiples, gutters space-2, corners radius-none (the sign is square)
